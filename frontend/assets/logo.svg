<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Gọng tai nghe (Headphones band) tối giản ôm sát đầu Robot -->
  <path d="M4.5 13.5c0-4.5 3-7.5 7.5-7.5s7.5 3 7.5 7.5" stroke="#8A8FD9" stroke-width="1.2" />
  
  <!-- Ốp tai nghe (Earpads) hai bên bo góc tinh xảo -->
  <rect x="2.5" y="11" width="2" height="5" rx="1" fill="#8A8FD9" stroke="#8A8FD9" stroke-width="0.5" />
  <rect x="19.5" y="11" width="2" height="5" rx="1" fill="#8A8FD9" stroke="#8A8FD9" stroke-width="0.5" />

  <!-- Đầu Robot bo góc sâu mềm mại và tràn viền sắc nét -->
  <rect width="14" height="10" x="5" y="8.5" rx="3" stroke="#8A8FD9" stroke-width="1.8" />
  
  <!-- Ăng ten tối giản trên đầu kèm chỏm tròn tinh tế -->
  <path d="M12 8.5V5" stroke="#8A8FD9" stroke-width="1.8" />
  <circle cx="12" cy="4" r="0.8" fill="#8A8FD9" stroke="none" />
  
  <!-- Nụ cười mỉm nhẹ nhàng, dễ thương và thân thiện -->
  <path d="M10.5 14.5c.5.4 1.5.4 2 0" stroke="#8A8FD9" stroke-width="1.5" />
  
  <!-- Mắt Robot dạng tròn to thông minh, rực sáng -->
  <circle cx="9" cy="12.5" r="1.2" fill="#8A8FD9" stroke="none" />
  <circle cx="15" cy="12.5" r="1.2" fill="#8A8FD9" stroke="none" />

  <!-- Chòm 3 sao AI lấp lánh (Sparkles) thon gọn, sắc nét kiểu Gemini/Claude -->
  <!-- Sao lớn (chủ đạo) -->
  <path d="M19 3.2c-.6 0-1-.4-1-1 0 .6-.4 1-1 1 .6 0 1 .4 1 1 0-.6.4-1 1-1Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.2" />
  <!-- Sao nhỡ (phía trên bên phải) -->
  <path d="M22.2 4.6c-.4 0-.6-.2-.6-.6 0 .4-.2.6-.6.6.4 0 .6.2.6.6 0-.4.2-.6.6-.6Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.2" />
  <!-- Sao nhỏ (phía dưới bên trái) -->
  <path d="M16.2 5.8c-.3 0-.4-.1-.4-.4 0 .3-.1.4-.4.4.3 0 .4.1.4.4 0-.3.1-.4.4-.4Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.2" />
</svg>
